apiVersion: v1
kind: Pod
metadata:
  name: legit-daemon-pod
spec:
  containers:
  - name: daemon
    image: continuumio/miniconda3
    command: ["sleep","infinity"]
    volumeMounts:
    - mountPath: /dev/shm
      name: dshm
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 2Gi
