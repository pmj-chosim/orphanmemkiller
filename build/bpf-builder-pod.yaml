apiVersion: v1
kind: Pod
metadata:
  name: bpf-builder
spec:
  hostPID: true
  containers:
  - name: builder
    image: ubuntu:24.04
    command: ["/bin/sh", "-c", "sleep infinity"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: modules
      mountPath: /lib/modules
      readOnly: true
    - name: debugfs
      mountPath: /sys/kernel/debug
    - name: btf
      mountPath: /sys/kernel/btf
      readOnly: true
  volumes:
  - name: modules
    hostPath:
      path: /lib/modules
  - name: debugfs
    hostPath:
      path: /sys/kernel/debug
  - name: btf
    hostPath:
      path: /sys/kernel/btf
